description: "tdd-manager agent baseline evaluation"

providers:
  - id: anthropic:claude-agent-sdk
    config:
      model: claude-sonnet-4-6
      working_dir: ./test-project
      max_turns: 40
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      custom_system_prompt: file://../../agents/tdd-manager.md

prompts:
  - id: add-reverse-function
    label: "Add reverseString to strings module via TDD"
    raw: |
      Add a reverseString(input: string): string function to the existing strings module at src/strings.ts.
      It should reverse the characters of the input string.
      Use strict RED/GREEN TDD. The existing test patterns are in src/strings.test.ts.

tests:
  - vars: {}
    assert:
      # Core TDD cycle markers in output
      - type: icontains
        value: "RED"
        weight: 3
      - type: icontains
        value: "GREEN"
        weight: 3
      - type: not-icontains
        value: "BLOCKED"
        weight: 2

      # Agent spawned SubAgents (not doing everything itself)
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const agentCalls = calls.filter(t => t.name === 'Agent');
          return {
            pass: agentCalls.length >= 2,
            score: Math.min(agentCalls.length / 4, 1.0),
            reason: `SubAgents spawned: ${agentCalls.length} (need >=2 for RED+IMPL)`
          };
        weight: 4

      # Tasks created for user visibility
      - type: javascript
        value: |
          const calls = context.providerResponse?.metadata?.toolCalls || [];
          const taskCalls = calls.filter(t => t.name === 'TaskCreate');
          return {
            pass: taskCalls.length >= 1,
            score: Math.min(taskCalls.length / 3, 1.0),
            reason: `Tasks created: ${taskCalls.length}`
          };
        weight: 3

      # Progress log referenced
      - type: javascript
        value: |
          const text = String(output);
          const hasLog = /\.zensu\/logs\/|progress.*log/i.test(text);
          return { pass: hasLog, reason: `Progress log ref: ${hasLog}` };
        weight: 2

      # Plan document referenced
      - type: javascript
        value: |
          const text = String(output);
          const hasPlan = /docs\/plans\//i.test(text);
          return { pass: hasPlan, reason: `Plan doc ref: ${hasPlan}` };
        weight: 2

      # No "out of scope" or "not testable" cop-outs
      - type: not-icontains
        value: "out of scope"
        weight: 2
      - type: not-icontains
        value: "not testable"
        weight: 2

evaluateOptions:
  maxConcurrency: 1
  repeat: 1
