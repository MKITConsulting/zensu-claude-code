description: "Claude Code Session Control v1 offline contract suite"

providers:
  - id: 'exec: node ./lib/contract-provider.js'

prompts:
  - id: session-control-contract
    raw: 'scenario={{scenario_id}}'

defaultTest:
  assert:
    - type: javascript
      value: file://assertions/control-attestation.js

tests:
  - file://scenarios/catalog.yaml

evaluateOptions:
  maxConcurrency: 4
  repeat: 1
