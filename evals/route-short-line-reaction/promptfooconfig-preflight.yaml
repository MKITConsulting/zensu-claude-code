description: "Preflight for the route short line reaction eval: two runs that prove the injection channel, the PreToolUse interception and an allowed call that runs, before the graded config spends its runs."

providers:
  - id: 'exec: ./provider.sh'
    config:
      working_dir: ./test-projects/cart-app
      init_git: true

prompts:
  - id: route-short-line-preflight
    label: "route short line preflight (nonce injection, Skill interception, allowed read)"
    raw: |
      route-eval-source: {{route_source}}
      {{user_message}}

defaultTest:
  options:
    transform: |
      return typeof output === 'string' ? output : JSON.stringify(output);
  assert:
    - type: javascript
      value: file://assertions/harness-attested.js
    - type: javascript
      value: file://assertions/harness-injection.js
    - type: javascript
      value: file://assertions/harness-isolation.js

tests:
  - file://scenarios/preflight/channel-check.yaml
  - file://scenarios/preflight/read-check.yaml

evaluateOptions:
  maxConcurrency: 1
  repeat: 1
