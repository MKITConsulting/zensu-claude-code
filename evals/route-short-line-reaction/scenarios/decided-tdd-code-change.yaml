description: "The decided build line alone, with the route set by hooks.defaultDeliveryRoute, on a code change. The reply begins with the exact status line, the source substituted for the placeholder, and runs the Zensu workflow through the Skill tool with the request as its argument, without asking and without recording anything."
vars:
  route_source: tdd-config
  user_message: "Add an optional discountPercent parameter to cartTotal in src/cart.js that reduces the item subtotal by that percentage before the shipping fee is added, default 0."
  expected_hook: reminder
  expected_shape: decided-tdd
  expected_field: build (hooks.defaultDeliveryRoute)
  expected_status: "Executing via /zensu:build (vanilla mode, route: hooks.defaultDeliveryRoute)"
  allowed_first: skill:zensu:build
  first_args_contains: discountPercent
  anchor_clause: "run the Zensu workflow without asking (the Skill tool with skill zensu:build and this request as the feature specification)"
assert:
  - type: javascript
    value: file://assertions/status-line-exact.js
  - type: javascript
    value: file://assertions/first-decisive.js
  - type: javascript
    value: file://assertions/no-route-question.js
  - type: javascript
    value: file://assertions/no-record-command.js
  - type: javascript
    value: file://assertions/no-placeholder-copy.js
