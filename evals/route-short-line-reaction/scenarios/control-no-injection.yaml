description: "Control: nothing is injected and the installed runtime's prompt hooks are silenced. The model must produce no route status line, no route or triage question, no route action (a Zensu Skill call, a route question through the tool, delegation, a Zensu CLI mutation or a route record command) and no hook scaffolding. Whether its first decisive action is an edit of the fixture is reported as the edit-first baseline that the decided direct line is read against; it does not grade the control. This baseline shows that the behaviour graded in the other scenarios comes from the injected line and not from a leaking hook or the host's own instructions."
vars:
  route_source: none
  user_message: "Add an optional discountPercent parameter to cartTotal in src/cart.js that reduces the item subtotal by that percentage before the shipping fee is added, default 0."
  expected_hook: ""
  expected_shape: none
  expected_field: n/a
assert:
  - type: javascript
    value: file://assertions/route-neutral.js
  - type: javascript
    value: file://assertions/no-route-status.js
  - type: javascript
    value: file://assertions/no-route-question.js
  - type: javascript
    value: file://assertions/no-record-command.js
  - type: javascript
    value: file://assertions/no-placeholder-copy.js
