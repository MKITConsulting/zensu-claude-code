description: "/zensu:reset-review-limit CAS eval suite (happy path + invalid-state fail-closed + retired-sidecar isolation)"

providers:
  - id: 'exec: ./provider.sh'
    config:
      working_dir: ./test-projects/empty-host
      require_disposable_environment: true
      init_git: true

prompts:
  - id: reset-review-limit-spec
    label: "reset-review-limit invocation runner (universal: spec_block OR spec_path)"
    raw: |
      {% if spec_block %}{{spec_block}}{% else %}{% include spec_path %}{% endif %}

defaultTest:
  options:
    transform: |
      return typeof output === 'string' ? output : JSON.stringify(output);
  assert:
    - type: javascript
      value: file://assertions/sealed-attestation.js

tests:
  - file://scenarios/reset-cas-happy.yaml
  - file://scenarios/reset-invalid-state.yaml
  - file://scenarios/reset-sidecar-isolation.yaml

evaluateOptions:
  maxConcurrency: 2
  repeat: 3
