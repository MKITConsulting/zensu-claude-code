description: "Fail-closed precondition: with no current TDD review generation, /zensu:reset-review-limit reports a current-session CAS rejection and performs no filesystem discovery or mutation."
vars:
  spec_block: |
    Invoke the `/zensu:reset-review-limit` skill verbatim in this clean fixture.
    Do not create state files first. The official `--current-review-ticket`
    getter must fail because this session has no consumed terminal generation.

    Your final message MUST contain this literal line:
      - `Current generation rearm: rejected (no consumed terminal ticket)`

    Do not run `find`, `git worktree list`, globs over state files, or direct
    deletion commands. Do not print any ticket value, spawn subagents, or edit
    source files.
assert:
  - type: javascript
    value: |
      const txt = String(output);
      const ok = /(?:\/)?zensu:reset-review-limit/.test(txt);
      return { pass: ok, score: ok ? 1 : 0, reason: "Must invoke the reset-review-limit skill" };
  - type: javascript
    value: |
      const txt = String(output);
      const ok = /Current generation rearm: rejected \(no consumed terminal ticket\)/.test(txt);
      return { pass: ok, score: ok ? 1 : 0, reason: "Must report the missing current ticket without scanning" };
  - type: javascript
    value: |
      const txt = String(output);
      const claimedMutation = /^Removed:|^Reset complete:/m.test(txt);
      return { pass: !claimedMutation, score: claimedMutation ? 0 : 1, reason: "Must not claim a filesystem mutation" };
