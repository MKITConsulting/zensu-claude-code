description: "Happy path: pre-seed two rounds-*.json counter files under .zensu/state/, invoke /zensu:reset-review-limit, verify both removed and the skill prints 'Reset complete' with the deleted paths."
vars:
  spec_block: |
    Perform this exact 3-step probe, in this exact order, using the Bash tool for steps 1 and 3:

    1. Pre-seed two counter files (Bash tool):
       ```
       mkdir -p .zensu/state
       printf '{"count":3,"ts":"2026-05-25T10:00:00Z"}\n' > .zensu/state/rounds-eval-sess-A.json
       printf '{"count":5,"ts":"2026-05-25T10:00:00Z"}\n' > .zensu/state/rounds-eval-sess-B.json
       ls .zensu/state/
       ```

    2. Invoke the `/zensu:reset-review-limit` skill verbatim. The skill MUST execute its Phase 2 bash recipe and print the removed paths.

    3. Verify by listing the directory (Bash tool):
       ```
       ls .zensu/state/ 2>/dev/null || echo "EMPTY"
       ```

    **CRITICAL OUTPUT REQUIREMENTS** — your final assistant message MUST contain (literal substrings, not paraphrased):
      - The skill's "Removed:" line for `rounds-eval-sess-A.json`
      - The skill's "Removed:" line for `rounds-eval-sess-B.json`
      - A "Reset complete:" summary line with the count of removed files
      - The post-reset directory listing showing the two counter files are gone

    Do NOT spawn subagents. Do NOT edit any source files. This is a trivial probe of the reset skill.
assert:
  - type: javascript
    value: |
      const txt = String(output);
      const hasSkillInvocation = /(?:\/)?zensu:reset-review-limit/.test(txt);
      return {
        pass: hasSkillInvocation,
        score: hasSkillInvocation ? 1 : 0,
        reason: "Output must reference the zensu:reset-review-limit skill (with or without leading slash — claude's tool_use payload renders the skill name without slash)"
      };
  - type: javascript
    value: |
      const txt = String(output);
      const hasRemovedA = /Removed:[^\n]*rounds-eval-sess-A\.json/.test(txt);
      return {
        pass: hasRemovedA,
        score: hasRemovedA ? 1 : 0,
        reason: "Output must contain 'Removed: <path>/rounds-eval-sess-A.json' line"
      };
  - type: javascript
    value: |
      const txt = String(output);
      const hasRemovedB = /Removed:[^\n]*rounds-eval-sess-B\.json/.test(txt);
      return {
        pass: hasRemovedB,
        score: hasRemovedB ? 1 : 0,
        reason: "Output must contain 'Removed: <path>/rounds-eval-sess-B.json' line"
      };
  - type: javascript
    value: |
      const txt = String(output);
      const hasResetComplete = /Reset complete:\s*2 counter file\(s\) deleted/.test(txt);
      return {
        pass: hasResetComplete,
        score: hasResetComplete ? 1 : 0,
        reason: "Output must contain 'Reset complete: 2 counter file(s) deleted' summary"
      };
  - type: javascript
    value: |
      const txt = String(output);
      const postReset = txt.split(/Reset complete/).pop() || "";
      const lsBlockMatch = postReset.match(/```[\s\S]{0,500}?```/);
      const lsBlock = lsBlockMatch ? lsBlockMatch[0] : postReset;
      const stillPresentInListing = /rounds-eval-sess-A\.json|rounds-eval-sess-B\.json/.test(lsBlock);
      return {
        pass: !stillPresentInListing,
        score: stillPresentInListing ? 0 : 1,
        reason: "Counter files must NOT appear in the post-reset 'ls' code block (narrative mentions are allowed since the skill itself may quote the removed paths)"
      };
