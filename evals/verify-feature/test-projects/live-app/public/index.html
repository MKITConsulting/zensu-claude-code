<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <link rel="icon" href="data:,">
    <title>Inventory Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f0f4f8;
        color: #102a43;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #eef6ff 0%, #f8fbff 48%, #edf7f3 100%); }
      main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
      .eyebrow { margin: 0 0 8px; color: #087f5b; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; letter-spacing: -0.04em; }
      .lede { max-width: 580px; margin: 16px 0 28px; color: #486581; font-size: 1.05rem; line-height: 1.65; }
      .panel { overflow: hidden; border: 1px solid #d9e2ec; border-radius: 18px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 18px 45px rgba(16, 42, 67, 0.12); }
      .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 24px; border-bottom: 1px solid #e6edf3; }
      .summary { margin: 0; color: #486581; font-weight: 700; }
      button { border: 0; border-radius: 10px; padding: 11px 16px; background: #087f5b; color: #fff; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 6px 14px rgba(8, 127, 91, 0.2); }
      button:hover { background: #06664a; }
      button:focus-visible { outline: 3px solid #74c0fc; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: 0.7; }
      .empty { margin: 0; padding: 34px 24px; color: #627d98; text-align: center; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 16px 24px; text-align: left; }
      th { background: #f8fafc; color: #486581; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
      tbody tr + tr { border-top: 1px solid #edf2f7; }
      td:last-child, th:last-child { text-align: right; }
      td:last-child { color: #087f5b; font-weight: 800; }
      .error { padding: 24px; color: #c92a2a; font-weight: 700; }
      [hidden] { display: none !important; }
      @media (max-width: 520px) {
        main { padding: 36px 0; }
        .panel-header { align-items: stretch; flex-direction: column; }
        button { width: 100%; }
        th, td { padding: 14px 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Operations</p>
      <h1>Inventory dashboard</h1>
      <p class="lede">Load the current warehouse snapshot and review available quantities.</p>
      <section class="panel" aria-labelledby="inventory-heading">
        <div class="panel-header">
          <p class="summary" id="inventory-heading" aria-live="polite">Inventory not loaded</p>
          <button id="load-inventory" type="button">Load inventory</button>
        </div>
        <p class="empty" id="empty-state">No inventory data has been requested yet.</p>
        <p class="error" id="error-state" role="alert" hidden>Inventory could not be loaded.</p>
        <table id="inventory-table" hidden>
          <thead><tr><th scope="col">Item</th><th scope="col">Quantity</th></tr></thead>
          <tbody id="inventory-body"></tbody>
        </table>
      </section>
    </main>
    <script>
      const button = document.querySelector('#load-inventory');
      const summary = document.querySelector('#inventory-heading');
      const empty = document.querySelector('#empty-state');
      const error = document.querySelector('#error-state');
      const table = document.querySelector('#inventory-table');
      const body = document.querySelector('#inventory-body');

      button.addEventListener('click', async () => {
        button.disabled = true;
        summary.textContent = 'Loading inventory…';
        error.hidden = true;
        try {
          const response = await fetch('/api/items');
          if (!response.ok) throw new Error(`Inventory request failed: ${response.status}`);
          const payload = await response.json();
          body.replaceChildren(...payload.items.map((item) => {
            const row = document.createElement('tr');
            const name = document.createElement('td');
            const quantity = document.createElement('td');
            name.textContent = item.name;
            quantity.textContent = String(item.quantity);
            row.append(name, quantity);
            return row;
          }));
          summary.textContent = `${payload.items.length} items available`;
          empty.hidden = true;
          table.hidden = false;
        } catch (_error) {
          summary.textContent = 'Inventory unavailable';
          empty.hidden = true;
          table.hidden = true;
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
