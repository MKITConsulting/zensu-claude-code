version: 1

vcs:
  provider: github
  prBase: main
  commitStyle: conventional
  worktreeOnly: true

services:
  - name: fixture-web
    up: "./scripts/fixture-runtime.sh up"
    ready: "./scripts/fixture-runtime.sh ready"
    down: "./scripts/fixture-runtime.sh down"
    isolation:
      bindHost: "127.0.0.1"
      port: "parent-reserved-exact"
      stateDir: ".verify-runtime"
      ownership: "exact-pid-and-server-path"

auth:
  mode: none
  artifact: none

validate:
  driver: browser
  baseUrlCommand: "./scripts/fixture-runtime.sh url"
  route: "/"
  navigationBroker:
    contractVersion: 1
    policyEnv: ZENSU_VERIFY_NAVIGATION_POLICY_V1
  evidenceSafety:
    contractVersion: 1
    mode: declared-safe
    dataClassification: synthetic
    routes: ["/"]
    containsPersonalData: false
    containsSecrets: false
