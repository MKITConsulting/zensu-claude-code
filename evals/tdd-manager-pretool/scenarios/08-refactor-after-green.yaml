description: "Happy: post-GREEN_PASS the agent enters REFACTOR phase. Gate permits edits in either phase."
vars:
  spec_path: prompts/feature-spec-refactor-after-green.md
assert:
  - type: javascript
    value: |
      const txt = String(output);
      const fsmMarker = /REFACTOR/.test(txt);
      const agentLog = /RF\s+—\s+tests\s+GREEN\s+before\+after/i.test(txt) || /REFACTOR\s+(phase|step|complete)/i.test(txt) || /refactor\s+complete/i.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation|missing precondition|missing scaffolding|no existing implementation/i.test(txt);
      const pass = fsmMarker || agentLog || parentRejection;
      return { pass, score: pass ? 1 : 0, reason: `fsmMarker=${fsmMarker} agentLog=${agentLog} parentRejection=${parentRejection}` };
  - type: javascript
    value: |
      const txt = String(output);
      const completed = /GREEN — PASS/.test(txt) && /RF — tests GREEN before\+after|REFACTOR/i.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation|missing precondition|missing scaffolding|no existing implementation/i.test(txt);
      const pass = completed || parentRejection;
      return {
        pass,
        score: pass ? 1 : 0,
        reason: `completed=${completed} parentRejection=${parentRejection} (GREEN_PASS->REFACTOR completed, or parent agent legitimately refuses because no baseline implementation exists to refactor)`
      };
