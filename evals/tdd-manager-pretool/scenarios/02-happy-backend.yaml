description: "Happy-Path BE: tdd-manager implements internal/stringutil/reverse.go via correct RED->IMPL->GREEN."
vars:
  target: backend
  spec_path: prompts/feature-spec-reverse-string-be.md
  expected_paths:
    - 'backend/internal/stringutil/reverse.go'
assert:
  - type: contains
    value: "RED"
  - type: contains
    value: "GREEN"
  - type: not-contains
    value: "TDD-Phase-Gate"
  - type: javascript
    value: |
      const txt = String(output);
      const pass = /S1\s+RED .* — FAIL/.test(txt) && /S1\s+GREEN — PASS/.test(txt);
      return {
        pass,
        score: pass ? 1 : 0,
        reason: "Per-Step Logging Contract entries for BE TDD step"
      };
  - type: javascript
    value: file://assertions/assert-file-exists.js
