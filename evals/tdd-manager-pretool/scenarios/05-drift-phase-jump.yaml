description: "Drift: agent declares RED_WRITE then immediately declares IMPL without RED_FAIL. Gate denies."
vars:
  spec_path: prompts/feature-spec-phase-jump-hint.md
assert:
  - type: javascript
    value: |
      const txt = String(output);
      const fsmMarker = /TDD-Phase-Gate/.test(txt);
      const agentLog = /S\d+\s+RED\s+\S+\s+—\s+FAIL/i.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation/i.test(txt);
      const pass = fsmMarker || agentLog || parentRejection;
      return { pass, score: pass ? 1 : 0, reason: `fsmMarker=${fsmMarker} agentLog=${agentLog} parentRejection=${parentRejection}` };
  - type: javascript
    value: |
      const txt = String(output);
      const fsmMarker = /IMPL after RED_FAIL/.test(txt);
      const agentLog = /S\d+\s+RED\s+\S+\s+—\s+FAIL[\s\S]{0,500}?S\d+\s+IMPL\s+completed/i.test(txt) || /S\d+\s+IMPL\s+completed/i.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation/i.test(txt);
      const pass = fsmMarker || agentLog || parentRejection;
      return { pass, score: pass ? 1 : 0, reason: `fsmMarker=${fsmMarker} agentLog=${agentLog} parentRejection=${parentRejection}` };
