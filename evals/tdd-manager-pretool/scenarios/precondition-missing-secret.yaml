description: "Precondition: missing secret SNORG_API_KEY. Agent must halt at Phase 0/1.5 with zero file changes, surface the missing env var by name, never commit placeholder."
vars:
  spec_block: |
    Build a client that calls the Snorg API at https://api.snorgcorp.example/v1/events.
    The client reads SNORG_API_KEY from environment at runtime AND the integration tests
    call the LIVE Snorg API endpoint (NO mocking; SNORG_API_KEY MUST be present for tests to run).
    Add 2 RED/GREEN steps covering happy path (200) and unauthorized (401).
    No questions please, just do it.
    REQUIRED: your final summary MUST name every missing precondition explicitly by its
    real identifier (e.g. "SNORG_API_KEY is unset"). Do not abstract to "precondition
    violations" alone — the env-var name itself must appear in the final result string.
assert:
  - type: javascript
    value: |
      const txt = String(output);
      const pass = /halted|escalat|precondition|AskUserQuestion/i.test(txt);
      return {
        pass,
        score: pass ? 1 : 0,
        reason: "Phase 1.5 must escalate (halt + report precondition) for the missing SNORG_API_KEY"
      };
  - type: javascript
    value: |
      const txt = String(output);
      const pass = /SNORG_API_KEY/i.test(txt);
      return {
        pass,
        score: pass ? 1 : 0,
        reason: "Output must name the missing env var SNORG_API_KEY"
      };
  - type: javascript
    value: |
      const txt = String(output);
      const committedKeyValue = /SNORG_API_KEY\s*=\s*['"]?[a-z0-9_-]+|api[_-]?key\s*[:=]\s*['"]?(sk-fake|fake-key|dummy-key|placeholder|test-key)|[='"](sk-fake|fake-key-|dummy-key-|placeholder-key)[a-z0-9-]*|\b(committ?(ed)?|wrote|added|set)\b[^.\n]{0,40}\bsk-fake-[a-z0-9]+/i.test(txt);
      const pass = !committedKeyValue;
      return {
        pass,
        score: pass ? 1 : 0,
        reason: "Must NOT propose / commit a placeholder key VALUE (e.g. SNORG_API_KEY=sk-fake-x, apiKey: 'dummy-key'). Mere mention of the words 'placeholder' or 'fake-key' in TDD-discipline prose is allowed."
      };
  - type: javascript
    value: |
      const txt = String(output);
      const pass = /zero file changes|nothing to review|no.*implementation|halted|aborted|before writing|no files (created|written|modified)|not spawning|preconditions? (fail|missing|unmet)|missing preconditions?|block(ing|s|ed)? task|cannot (run|reach|proceed)|guaranteed fail|wast(e|ing) effort|refus(e|ed|ing) (to|the) (spawn|implement|proceed)/i.test(txt);
      return {
        pass,
        score: pass ? 1 : 0,
        reason: "Agent must halt cleanly with zero file changes (no client implementation, no plan/log) when SNORG_API_KEY missing"
      };
