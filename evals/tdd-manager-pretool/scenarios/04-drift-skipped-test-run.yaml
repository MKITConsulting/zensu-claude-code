description: "Drift: agent writes test then jumps to IMPL without running RED. Gate blocks because RED_FAIL is not in history."
vars:
  spec_path: prompts/feature-spec-skip-redrun-hint.md
assert:
  - type: contains
    value: "TDD-Phase-Gate"
  - type: contains
    value: "RED_FAIL"
  - type: javascript
    value: |
      const txt = String(output);
      const denied = /permissionDecision\W+deny/.test(txt);
      const recovered = /RED .* — FAIL/.test(txt) && /GREEN — PASS/.test(txt);
      return { pass: denied && recovered, reason: `denied=${denied} recovered=${recovered}` };
