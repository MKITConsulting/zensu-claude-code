description: "Drift: agent writes test then jumps to IMPL without running RED. Gate blocks because RED_FAIL is not in history."
vars:
  spec_path: prompts/feature-spec-skip-redrun-hint.md
assert:
  - type: javascript
    value: |
      const txt = String(output);
      const fsmMarker = /TDD-Phase-Gate/.test(txt);
      const agentLog = /S\d+\s+RED\s+\S+\s+—\s+FAIL/i.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation/i.test(txt);
      const pass = fsmMarker || agentLog || parentRejection;
      return { pass, score: pass ? 1 : 0, reason: `fsmMarker=${fsmMarker} agentLog=${agentLog} parentRejection=${parentRejection}` };
  - type: javascript
    value: |
      const txt = String(output);
      const fsmMarker = /RED_FAIL/.test(txt);
      const agentLog = /S\d+\s+RED\s+\S+\s+—\s+FAIL|RED\s+FAIL|red phase|test.{0,5}fail/i.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation/i.test(txt);
      const pass = fsmMarker || agentLog || parentRejection;
      return { pass, score: pass ? 1 : 0, reason: `fsmMarker=${fsmMarker} agentLog=${agentLog} parentRejection=${parentRejection}` };
  - type: javascript
    value: |
      const txt = String(output);
      const denied = /permissionDecision\W+deny/.test(txt);
      const recovered = /RED .* — FAIL/.test(txt) && /GREEN — PASS/.test(txt);
      const parentRejection = /tdd-manager\s+(refus|enforce\s+strict|block|halt|flag)|agent\s+(block|refus)|zero file changes|no code written|TDD discipline violation/i.test(txt);
      const pass = denied || recovered || parentRejection;
      return { pass, score: pass ? 1 : 0, reason: `denied=${denied} recovered=${recovered} parentRejection=${parentRejection}` };
