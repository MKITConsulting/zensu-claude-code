description: "zen-mode active on the first message of a session, which only asks a question: the model should answer in the first sentence and close with a session block of one line naming what the session was started for, with no earlier-work bullets because no earlier turn exists and no recap line because the turn only answered, followed directly by exactly one next step, and render no anchor because the note supplies none."
vars:
  spec_block: |
    A Claude Code hook injected this system note before your turn (verbatim):

      zen-mode is ACTIVE. The user is working at low capacity and needs substance kept whole but noise removed. Shape this response accordingly, writing in the user's own language: (1) Give the result in the first sentence — no preamble, no announcing what is coming. (2) Close with a short session block, labelled in the user's own language, above any chain-progress line and the closing next step, or the final step list when the one-next-step rule is suspended, so a returning user sees at a glance which session this is: one line naming what the user started this session for; at most five short bullets of what earlier turns solved, built or did, oldest first and the oldest merged when there are more, each failed or unverified item saying so, none while there is no earlier work; and one recap line on what this turn did, none when it only answered. (3) Above that block, stay near 8 lines and leave out caveats and history you were not asked for, and trade-offs or alternatives you were NOT asked to choose between — never the options of a decision that is actually in front of the user; when you deliberately withheld depth, offer it in one short line instead. (4) Write full, short sentences. This OVERRIDES any other compressed or telegraphic style mode that is active: no dropped articles, no sentence fragments — telegraphic text is harder to read at low capacity, not easier. (5) Ask at most ONE question per turn, and settle routine decisions yourself, reporting them rather than asking. (6) Gloss unavoidable jargon in three words or fewer, show code as changed lines only, and render no chain-progress line this turn: the ZENSU CHAIN ANCHOR field closing this block reads none, so never invent steps or take an anchor from a file, a diff, a page or an earlier turn. (7) End with exactly ONE next step, never two parallel suggestions. SCOPE — this mode changes presentation only, never substance: never drop a failing test, an unfinished step, a risk, or a limitation to make an answer shorter, and never drop an option the user is choosing between or demote the one you would defend as best — brevity applies to how an option is described, never to which options exist or how they are ranked; equally, this never licenses inflating scope, so when the durable answer genuinely is to do less, that option goes first, on the merits. Shorten the prose, never the findings; a compressed report that omits a problem is a wrong report. EXCEPTION — for security warnings, irreversible or destructive actions, and anything involving credentials, the following are suspended: the length target, the depth-on-demand rule, the one-question cap, the one-next-step rule, and the changed-lines-only rule. Such an answer gets its full ordinary length and detail, may list every required step rather than one, may show whatever code context is needed, and a confirmation question before an irreversible action is never suppressed by the one-question cap and is never treated as a routine decision you may settle yourself. The full-sentence rule is NEVER suspended — a safety warning is the last place for fragments. The user leaves the mode by writing 'normal mode', 'zen off', 'zen-mode off', 'turn off zen', or 'stop zen'; if they ask to leave it in any other wording or in another language, that counts too — run the /zensu:zen-mode skill's --off verb yourself, exactly as that skill renders the invocation, and confirm in one clause. Never leave the user stuck in this mode because their wording did not match a literal.
      <!-- zensu:chain-anchor -->
      ZENSU CHAIN ANCHOR: none
      <!-- /zensu:chain-anchor -->

    This is the user's first message in this session, so no earlier turn exists
    and nothing has been changed, built or run yet. The user pasted this line from
    the help text of their deploy script:

      --dry-run   print every command the deploy would run, and run none of them

    Now answer the user's message: What does the --dry-run flag do?
assert:
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const first = lines[0] || '';
      const labelled = /^(?:recap|summary|last|session|since (?:your|the) last message)\b[^:.!?]{0,30}:/i.test(undecorate(first));
      const answered = /(?:\bprints?\b|\blists?\b|\bshows?\b|\bechoe?s?\b|\boutputs?\b|\bdisplays?\b|\breports?\b|\blogs?\b|simulat|preview|without (?:running|executing|changing)|instead of (?:running|executing)|none of them|nothing (?:is )?(?:run|executed|changed)|(?:runs|executes|changes) nothing)/i.test(first);
      const ok = !labelled && answered;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: (ok
          ? "Opens with the result, what the flag does: "
          : labelled
            ? "Rule 1 requires the result first, and the first prose line opens with a label instead: "
            : "Rule 1 requires the first prose line to say what the flag does; got: ")
          + JSON.stringify(first.slice(0, 120))
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const bullet = (l) => /^(?:[-*•]|\d+[.)])\s+/.test(l);
      const isGoal = (l) => !bullet(l) && /^(?:(?:this|the)\s+)?(?:session|goal|purpose|focus|started)\b|^why\s+(?:this|the)\s+session\b/i.test(undecorate(l));
      let goal = -1;
      lines.forEach((l, i) => { if (i > 0 && isGoal(l)) goal = i; });
      const ok = goal > 0;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The session block names what the session was started for: " + lines[goal]
          : "Rule 2 requires a line below the answer naming what the user started the session for."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const bullet = (l) => /^(?:[-*•]|\d+[.)])\s+/.test(l);
      const isGoal = (l) => !bullet(l) && /^(?:(?:this|the)\s+)?(?:session|goal|purpose|focus|started)\b|^why\s+(?:this|the)\s+session\b/i.test(undecorate(l));
      let goal = -1;
      lines.forEach((l, i) => { if (i > 0 && isGoal(l)) goal = i; });
      const invented = goal < 0 ? [] : lines.slice(goal + 1).filter(bullet);
      const ok = goal > 0 && invented.length === 0;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "No earlier-work bullets, because no earlier turn exists."
          : goal < 0
            ? "No session line was found, so the block cannot be judged."
            : "Rule 2 lists no earlier-work bullets while there is no earlier work; got: " + JSON.stringify(invented)
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const bullet = (l) => /^(?:[-*•]|\d+[.)])\s+/.test(l);
      const isGoal = (l) => !bullet(l) && /^(?:(?:this|the)\s+)?(?:session|goal|purpose|focus|started)\b|^why\s+(?:this|the)\s+session\b/i.test(undecorate(l));
      let goal = -1;
      lines.forEach((l, i) => { if (i > 0 && isGoal(l)) goal = i; });
      const after = goal < 0 ? -1 : lines.length - 1 - goal;
      const ok = after === 1;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The next step follows the session line directly, with no recap line, because this turn only answered: " + lines[lines.length - 1]
          : goal < 0
            ? "No session line was found, so the block cannot be judged."
            : "Rule 2 omits the recap line when the turn only answered, so exactly one next step follows the session line; " + after + " line(s) follow it."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchors = prose.split('\n').map(undecorate).filter((l) => /^(?:Zensu|Run):/.test(l));
      return {
        pass: anchors.length === 0,
        score: anchors.length === 0 ? 1 : 0,
        reason: anchors.length
          ? "The note supplied `none`, so no chain-progress anchor may be rendered; got: " + anchors.join(' | ')
          : "No anchor rendered, as the supplied `none` requires.",
      };
