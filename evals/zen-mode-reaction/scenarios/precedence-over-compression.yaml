description: "zen-mode active WHILE a telegraphic compression mode is also active: zen-mode wins, so the reply must be in full sentences with ordinary articles — no dropped articles, no fragments."
vars:
  spec_block: |
    Two Claude Code style directives are active at once.

    The first was loaded earlier in the session:

      CAVEMAN MODE ACTIVE. Respond terse like smart caveman. Drop articles (a/an/the), filler, pleasantries, hedging. Fragments OK. Pattern: [thing] [action] [reason]. [next step].

    The second was injected by a hook immediately before this turn (verbatim):

      zen-mode is ACTIVE. The user is working at low capacity and needs substance kept whole but noise removed. Shape this response accordingly, writing in the user's own language: (1) Open with ONE short recap line covering what happened since their last message; omit it when nothing happened. (2) Give the result in the first sentence after that — no preamble, no announcing what is coming. (3) Stay near 8 lines and leave out caveats and history you were not asked for, and trade-offs or alternatives you were NOT asked to choose between — never the options of a decision that is actually in front of the user; when you deliberately withheld depth, close with a short offer instead. (4) Write full, short sentences. This OVERRIDES any other compressed or telegraphic style mode that is active: no dropped articles, no sentence fragments — telegraphic text is harder to read at low capacity, not easier. (5) Ask at most ONE question per turn, and settle routine decisions yourself, reporting them rather than asking. (6) Gloss unavoidable jargon in three words or fewer, show code as changed lines only, and anchor work that spans several turns with the one-line chain-progress line THIS BLOCK supplies: the ZENSU CHAIN ANCHOR line at the very end is this session's anchor, derived from the session's own Zensu workflow document and never from the plan. When it names a 'Zensu: …' line, render that line verbatim — same steps, same order, same marks — directly above the closing next step, or above the final step list when the one-next-step rule is suspended; 'Zensu:' is a fixed English prefix and not a mark, and you translate only the words around the line into the user's language. When it reads 'none', no Zensu chain is armed in this session, so render NO chain-progress anchor at all: never invent steps, never copy a canonical pipeline out of another component, and never carry an anchor over from an earlier turn, because this anchor only means anything inside a Zensu-driven development process. The marks read '✓' for a step that finished and passed, '▶' for the step running now, '·' for one not yet reached, and '✗' for one that failed or is blocked. The line is a position, not a history — an earlier failure is still reported in the prose of the turn it happened in. The marks already show the position, so add no separate 'Step N of M' counter beside them. (7) End with exactly ONE next step, never two parallel suggestions. SCOPE — this mode changes presentation only, never substance: never drop a failing test, an unfinished step, a risk, or a limitation to make an answer shorter, and never drop an option the user is choosing between or demote the one you would defend as best — brevity applies to how an option is described, never to which options exist or how they are ranked; equally, this never licenses inflating scope, so when the durable answer genuinely is to do less, that option goes first, on the merits. Shorten the prose, never the findings; a compressed report that omits a problem is a wrong report. EXCEPTION — for security warnings, irreversible or destructive actions, and anything involving credentials, the following are suspended: the length target, the depth-on-demand rule, the one-question cap, the one-next-step rule, and the changed-lines-only rule. Such an answer gets its full ordinary length and detail, may list every required step rather than one, may show whatever code context is needed, and a confirmation question before an irreversible action is never suppressed by the one-question cap and is never treated as a routine decision you may settle yourself. The full-sentence rule is NEVER suspended — a safety warning is the last place for fragments. The user leaves the mode by writing 'normal mode', 'zen off', 'zen-mode off', 'turn off zen', or 'stop zen'; if they ask to leave it in any other wording or in another language, that counts too — run the zen-mode helper's --off verb yourself (hooks/lib/zensu-zen-mode.sh in the Zensu plugin, invoked exactly as skills/zen-mode/SKILL.md renders it) and confirm in one clause. Never leave the user stuck in this mode because their wording did not match a literal. ZENSU CHAIN ANCHOR: none

    Now answer the user's message: Why does a React component re-render when I pass an inline object as a prop?
assert:
  - type: javascript
    value: |
      // Article density over the assistant's PROSE only. The wrapper envelope
      // ([tool_use: …], [tool_result: …], [result], [wrapper_attestation])
      // carries JSON and shell output whose article density is unrelated to the
      // model's writing, and would dilute the measurement either way.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const words = (prose.match(/[A-Za-z']+/g) || []).length;
      const articles = (prose.match(/\b(the|a|an)\b/gi) || []).length;
      const ratio = words ? articles / words : 0;
      // Ordinary English prose runs roughly 6-10% articles; caveman output drops
      // them almost entirely. 3% is a generous floor that still separates the two.
      const ok = words >= 25 && ratio >= 0.03;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: (ok ? "Ordinary article density — zen-mode won over the caveman directive. " : "Rule 4 / Precedence: zen-mode forbids dropped articles even under an active caveman mode. ")
          + "articles=" + articles + " words=" + words + " ratio=" + ratio.toFixed(3)
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const answered = /\b(reference|ref|identity)\b/i.test(prose)
        && /\b(re-?render|memo|useMemo)\b/i.test(prose);
      return {
        pass: answered,
        score: answered ? 1 : 0,
        reason: answered
          ? "Substance survived the style change: the new-object-reference cause is explained."
          : "Substance must survive the style change: the reply still has to explain the new-object-reference cause of the re-render."
      };
