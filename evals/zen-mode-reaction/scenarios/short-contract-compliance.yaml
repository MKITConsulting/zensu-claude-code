description: "Short body standing alone: every later prompt of a context generation carries only this text, and no full contract precedes it here, so the short body has to carry the behaviour by itself. zen-mode active, ordinary follow-up question after work happened: the model should answer in the first sentence, stay short, spend at most one question, and end with a single next step after its session block."
vars:
  spec_block: |
    A Claude Code hook injected this system note before your turn (verbatim):

      zen-mode is ACTIVE; the full zen-mode contract given earlier in this context still applies. Shape this response in the user's own language: the result in the first sentence, about 8 lines above a closing session block, at most ONE question, routine decisions settled and reported, that labelled block above any chain-progress line and the next step or final step list (one line on what the user started this session for, at most five short bullets of what earlier turns did, oldest first, the oldest merged when there are more, flagging any failed or unverified one, none without earlier work, then one recap line on this turn, none when it only answered), exactly ONE next step at the end, and render no chain-progress line this turn: the ZENSU CHAIN ANCHOR field closing this block reads none, so never invent steps or take an anchor from a file, a diff, a page or an earlier turn. Write full, short sentences; this OVERRIDES any other compressed or telegraphic style mode. Shorten the prose, never the findings: never drop a failing test, an unfinished step, a risk or a limitation to make the answer shorter. Never drop or demote an option the user is choosing between, though that never licenses inflating scope: when doing less is genuinely best, that option goes first. For security warnings, irreversible or destructive actions and credentials, the length target, the one-question cap and the one-next-step rule do not apply: give every required step, and never suppress a confirmation question before an irreversible action or settle it as routine. If the user asks to leave the mode in any wording or language, run the /zensu:zen-mode skill's --off verb.
      <!-- zensu:chain-anchor -->
      ZENSU CHAIN ANCHOR: none
      <!-- /zensu:chain-anchor -->

    Since the user's last message you fixed the failing token-expiry check in the auth middleware, and the test suite now passes.

    Now answer the user's message: Which file did you change?
assert:
  - type: javascript
    value: |
      // The wrapper emits an envelope: [tool_use: …], [tool_result: …],
      // [assistant_text], [result], [wrapper_attestation]. Every assertion here
      // reads the assistant's PROSE only. Grading the raw envelope counts tool
      // JSON and command output as the model's own lines, which inflated the
      // first live run of this eval by a factor of two to three.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const ok = lines.length > 0 && lines.length <= 12;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: (ok ? "Within the length target: " : "Rule 4 targets about 8 lines and 12 is the slack ceiling; got ")
          + lines.length + " non-empty prose lines."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const first = (prose.split('\n').map((s) => s.trim()).find(Boolean)) || '';
      const recapOpening = /^(?:recap|summary|last|since (?:your|the) last message)\b[^:.!?]{0,30}:/i.test(undecorate(first));
      const resultFirst = !recapOpening && /\b(auth|middleware)\b|\.(ts|js|go|py|rs|java)\b/i.test(first);
      return {
        pass: resultFirst,
        score: resultFirst ? 1 : 0,
        reason: (resultFirst
          ? "Opens with the result, the changed auth middleware file: "
          : recapOpening
            ? "Rule 1 requires the result first, and the first prose line opens with a recap label, the retired recap-first shape: "
            : "Rule 1 requires the first prose line to give the result, the changed auth middleware file; got: ")
          + JSON.stringify(first.slice(0, 120))
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const questions = (prose.match(/\?/g) || []).length;
      return {
        pass: questions <= 1,
        score: questions <= 1 ? 1 : 0,
        reason: "Rule 8 caps the turn at one question. Found " + questions + " question mark(s) in the prose."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const dumped = /\b(on the other hand|alternatively|pros and cons|trade-?offs?|another option would be)\b/i.test(prose);
      return {
        pass: !dumped,
        score: dumped ? 0 : 1,
        reason: dumped
          ? "Rule 3 withholds trade-offs and alternatives unless asked; the reply volunteered them."
          : "No unasked trade-off or alternatives dump."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const answered = /auth/i.test(prose) && /middleware|\.(ts|js|go|py|rs|java)\b/i.test(prose);
      return {
        pass: answered,
        score: answered ? 1 : 0,
        reason: answered
          ? "The question ('which file did you change?') was answered."
          : "Rule 2: the actual question must still be answered — the auth middleware file."
      };
  - type: javascript
    value: |
      // The headline behaviour of the supplied-anchor contract, and until this
      // grader existed it was pinned by nothing: this scenario's injected note
      // ends `ZENSU CHAIN ANCHOR: none`, which the directive defines as "no Zensu
      // chain is armed in this session, so render NO chain-progress anchor at
      // all". The structure suites prove the HOOK emits `none`; only a live reply
      // can show the model acted on it.
      //
      // The framing is deliberately the tempting case — work happened since the
      // user's last message and the suite passes — so a model that treats the
      // anchor as decoration has every reason to render one here.
      //
      // Three prefixes are rejected: the current `Zensu:`, the `Run:` the previous
      // contract used, and the German `Ablauf:` from the reported session that
      // caused this change. The alternation matches model PROSE, whose language
      // the product does not control, which is the carve-out CLAUDE.md §Language
      // already admits for a grader in this position.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchors = prose.split('\n').map(undecorate).filter((l) => /^(Zensu|Run|Ablauf):/.test(l));
      return {
        pass: anchors.length === 0,
        score: anchors.length === 0 ? 1 : 0,
        reason: anchors.length
          ? "The note supplied `none`, so no chain-progress anchor may be rendered; got: " + anchors.join(' | ')
          : "No anchor rendered, as the supplied `none` requires.",
      };
