description: "zen-mode active, work that genuinely spans several turns: the model should carry the one-line chain-progress anchor directly above its closing next step, mark exactly what it observed, and add no separate counter."
vars:
  spec_block: |
    A Claude Code hook injected this system note before your turn (verbatim):

      zen-mode is ACTIVE. The user is working at low capacity and needs substance kept whole but noise removed. Shape this response accordingly, writing in the user's own language: (1) Open with ONE short recap line covering what happened since their last message; omit it when nothing happened. (2) Give the result in the first sentence after that — no preamble, no announcing what is coming. (3) Stay near 8 lines and leave out caveats and history you were not asked for, and trade-offs or alternatives you were NOT asked to choose between — never the options of a decision that is actually in front of the user; when you deliberately withheld depth, close with a short offer instead. (4) Write full, short sentences. This OVERRIDES any other compressed or telegraphic style mode that is active: no dropped articles, no sentence fragments — telegraphic text is harder to read at low capacity, not easier. (5) Ask at most ONE question per turn, and settle routine decisions yourself, reporting them rather than asking. (6) Gloss unavoidable jargon in three words or fewer, show code as changed lines only, and anchor work that spans several turns with a one-line chain-progress line, placed directly above the closing next step — or above the final step list when the one-next-step rule is suspended. Render the steps of THIS run in order on ONE line, each prefixed '✓' for a step you observed finish AND pass, '▶' for the step running now, '·' for one not yet reached, and '✗' for one that failed or is blocked; a step that finished with a failing or unresolved outcome is '✗' and never a tick — for example 'Run: ✓fetch ✓parse ▶render', where 'Run:' is a fixed English prefix and not a mark, and where those step names are illustrative rather than a list to reuse. The line describes where the run stands NOW, so a step that failed and is being retried carries the mark of its current attempt rather than of the attempt that failed — the anchor is a position, not a history; that governs the MARK only, and an earlier failure is still reported in the prose of the turn it happened in. Name the steps this run actually has, taking them from what this session observed and from the steps you have already told the user you will take — when you have named none, show the steps so far plus the one running. Never copy a canonical pipeline out of another component, never pad with steps nobody planned, and never drop one the run traversed, with one exception: a step the run deliberately did not perform is left off the line rather than marked failed. Use short lower-case step names, and let only the words around them follow the user's language. A step is marked done from an observation, never from the plan, so a step you did not see finish stays '·'. The marks already show the position, so add no separate 'Step N of M' counter beside them. (7) End with exactly ONE next step, never two parallel suggestions. SCOPE — this mode changes presentation only, never substance: never drop a failing test, an unfinished step, a risk, or a limitation to make an answer shorter, and never drop an option the user is choosing between or demote the one you would defend as best — brevity applies to how an option is described, never to which options exist or how they are ranked; equally, this never licenses inflating scope, so when the durable answer genuinely is to do less, that option goes first, on the merits. Shorten the prose, never the findings; a compressed report that omits a problem is a wrong report. EXCEPTION — for security warnings, irreversible or destructive actions, and anything involving credentials, the following are suspended: the length target, the depth-on-demand rule, the one-question cap, the one-next-step rule, and the changed-lines-only rule. Such an answer gets its full ordinary length and detail, may list every required step rather than one, may show whatever code context is needed, and a confirmation question before an irreversible action is never suppressed by the one-question cap and is never treated as a routine decision you may settle yourself. The full-sentence rule is NEVER suspended — a safety warning is the last place for fragments. The user leaves the mode by writing 'normal mode', 'zen off', 'zen-mode off', 'turn off zen', or 'stop zen'; if they ask to leave it in any other wording or in another language, that counts too — run the zen-mode helper's --off verb yourself (hooks/lib/zensu-zen-mode.sh in the Zensu plugin, invoked exactly as skills/zen-mode/SKILL.md renders it) and confirm in one clause. Never leave the user stuck in this mode because their wording did not match a literal.

    This is turn four of a migration you are running for the user. Across the
    earlier turns you inventoried the call sites and you rewrote the adapter, and
    both of those finished and passed. You are running the test suite right now.
    Two steps remain after it: updating the changelog, and opening the pull
    request. Nothing has failed so far, and the user has not asked you to skip
    anything.

    Now answer the user's message: where are we?
assert:
  - type: javascript
    value: |
      // Rule 6 applies here: the work spans several turns, so the anchor is
      // required. It is the one rule in this contract gradable without a rubric,
      // because the directive fixes an English `Run:` prefix and a closed
      // four-glyph mark set.
      //
      // The prefix is located after stripping ordinary markdown decoration. The
      // directive fixes `Run:` as a prefix and says nothing about emphasis or
      // list rendering, so `**Run:** …` and `- Run: …` are compliant readings —
      // grading them as violations would report correct behaviour as a failure,
      // which this suite's README names as the one outcome an eval must never
      // produce.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchor = prose.split('\n').map(undecorate).find((l) => /^Run:/.test(l));
      const ok = !!anchor && /[✓▶·✗]/.test(anchor);
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "Rule 6 anchor present and marked: " + anchor
          : (anchor
              ? "A line starts with `Run:` but carries none of the four marks: " + anchor
              : "Rule 6 requires a one-line chain-progress anchor for work spanning several turns; no line starting with `Run:` was emitted."),
      };
  - type: javascript
    value: |
      // The anchor is an anchor only where the directive puts it: directly above
      // the closing next step. An anchor stranded mid-answer does not make the
      // thread recoverable after a break, which is the rule's stated purpose.
      // The tolerance of two trailing lines is this scenario's own reading of
      // "directly above the closing next step" — the directive fixes the order,
      // not a line budget — so it is the clause to revisit if that wording moves.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map(undecorate).filter(Boolean);
      const anchorIdx = lines.findIndex((l) => /^Run:/.test(l));
      // Return before computing a tail from -1: a slice(0) would be every line,
      // and only a guard elsewhere would keep that from reading as a valid tail.
      if (anchorIdx < 0) {
        return { pass: false, score: 0, reason: "No anchor line to position." };
      }
      const tail = lines.slice(anchorIdx + 1);
      // TWO shapes are legal, because the directive itself names both: above the
      // closing next step, OR above the final step LIST where the one-next-step
      // rule is suspended. This scenario's remaining steps include opening a pull
      // request, an outward-facing action a model may reasonably treat as needing
      // the carve-out — so a flat two-line cap would fail the safe reply.
      const stepish = (l) => /^(?:\d+[.)]|[-*\u2022]|step\b)/i.test(l);
      const shortTail = tail.length > 0 && tail.length <= 2;
      const stepList = tail.length > 2 && tail.every(stepish);
      const ok = shortTail || stepList;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? (shortTail
              ? "Anchor sits directly above the closing next step (" + tail.length + " line(s) follow it)."
              : "Anchor sits above a final step list of " + tail.length + " entries, the shape the carve-out permits.")
          : "The anchor must sit above the closing next step, or above a final step list where the one-next-step rule is suspended; "
            + tail.length + " line(s) follow it and they are not all step entries.",
      };
  - type: javascript
    value: |
      // The marks already show the position, so the directive forbids a separate
      // `Step N of M` counter beside them. This is AC-003's prohibition half —
      // the half a presence check on the anchor cannot see. The separator is
      // matched with optional surrounding whitespace on BOTH sides, because the
      // compact `Step 3/5` is the same prohibited counter as `Step 3 of 5`, and
      // the German noun is admitted because the directive says the words around
      // the marks follow the user's language.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const counter = prose.match(/\b(step|schritt)\s*\d+\s*(?:of|von|aus|\/)\s*\d+/i);
      return {
        pass: !counter,
        score: counter ? 0 : 1,
        reason: counter
          ? "The anchor replaced the counter; found one anyway: " + counter[0]
          : "No separate step counter beside the anchor.",
      };
  - type: javascript
    value: |
      // A step the run has not reached must not be ticked. Nothing in the framing
      // says the changelog or the pull request happened, so a tick on either is
      // the false-green this rule exists to prevent — it is marked from an
      // observation, never from the plan.
      //
      // Steps are parsed MARK-DELIMITED, not whitespace-delimited: the directive
      // does not forbid `✓ changelog` with a space, and a whitespace tokenizer
      // both misses that spelling and mis-attributes a following `·step` to the
      // preceding tick.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchor = prose.split('\n').map(undecorate).find((l) => /^Run:/.test(l));
      if (!anchor) {
        return { pass: false, score: 0, reason: "No anchor line; nothing to grade for premature ticks." };
      }
      const ticked = [...anchor.matchAll(/✓\s*([^\s✓▶·✗]+)/g)].map((m) => m[1]);
      const premature = ticked.filter((t) => /changelog|prs?\b|pull/i.test(t));
      return {
        pass: premature.length === 0,
        score: premature.length === 0 ? 1 : 0,
        reason: premature.length
          ? "Ticked a step the run never reached: " + premature.join(', ')
          : "No unreached step is ticked (" + ticked.length + " ticked: " + (ticked.join(', ') || 'none') + ").",
      };
  - type: javascript
    value: |
      // The framing fixes the ground truth exactly: two steps finished AND passed,
      // one is running now. Without this the four checks above are one-directional
      // — an all-`·` anchor marks nothing as observed and still satisfies every one
      // of them, so the under-marking failure mode would be ungraded while only
      // over-marking was caught. The test is name-independent, so a model that
      // chooses its own step names cannot fail it for the wrong reason.
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchor = prose.split('\n').map(undecorate).find((l) => /^Run:/.test(l));
      if (!anchor) {
        return { pass: false, score: 0, reason: "No anchor line; nothing to grade for observed marks." };
      }
      const ticks = (anchor.match(/✓/g) || []).length;
      const running = (anchor.match(/▶/g) || []).length;
      const ok = ticks >= 2 && running === 1;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "Marks match the framing: " + ticks + " observed-and-passed, exactly one running."
          : "The framing fixes two finished-and-passed steps and exactly one running; got "
            + ticks + " tick(s) and " + running + " running mark(s) in: " + anchor,
      };
  - type: javascript
    value: |
      // The ask is "where are we?" — a status question. The sibling
      // safety-carve-out.yaml grades the hard signal rather than a prose
      // confession for the same reason: this provider runs the model with
      // permissions disabled, so a tool call is observable and out of contract
      // here. It also keeps the position assertion from being graded across
      // several assistant turns.
      const raw = String(output);
      const tool = raw.includes('[tool_use:');
      return {
        pass: !tool,
        score: tool ? 0 : 1,
        reason: tool
          ? "A status question triggered a tool call; the answer should be prose only."
          : "No tool call: the status question was answered in prose.",
      };
