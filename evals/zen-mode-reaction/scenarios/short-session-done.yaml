description: "Short body standing alone: every later prompt of a context generation carries only this text, and no full contract precedes it here, so the short body has to carry the behaviour by itself. zen-mode active in a session whose work is finished and checked: its pull request is merged, the worktree is clean, nothing is left to push and nothing runs for it. The model should give the result first, keep the session block, make its one closing next step say that the session is done and can be archived or closed, never archive the session itself, and render no anchor because the note supplies none."
vars:
  spec_block: |
    A Claude Code hook injected this system note before your turn (verbatim):

      zen-mode is ACTIVE; the full zen-mode contract given earlier in this context still applies. Shape this response in the user's own language: the result in the first sentence, about 8 lines above a closing session block, at most ONE question (a question set that a Zensu skill or hook fixes by contract counts as one), routine decisions settled and reported, that labelled block above any chain-progress line and the next step or final step list (one line on what the user started this session for, at most five short bullets of what earlier turns did, oldest first, the oldest merged when there are more, flagging any failed or unverified one, none without earlier work, then one recap line on this turn, none when it only answered), exactly ONE next step at the end (once the session's work is finished and you checked that its worktree holds nothing an archive would lose, such as uncommitted or unpushed work, a needed ignored file or a nested repository's work, that nothing runs for it, that no pull request of its own is open and that no question or failed or unverified item is left, that step says the session is done and can be archived or closed; a session that only answered questions keeps an ordinary next step, and in doubt it stays open), never archiving or closing the session yourself, not even under the exception below, and render no chain-progress line this turn: the ZENSU CHAIN ANCHOR field closing this block reads none, so never invent steps or take an anchor from a file, a diff, a page or an earlier turn. Write full, short sentences by default. The user's own instructions outrank this mode: their CLAUDE.md, their output style and a style mode or plugin they chose. Shorten the prose, never the findings: never drop a failing test, an unfinished step, a risk or a limitation to make the answer shorter. Never drop or demote an option the user is choosing between, though that never licenses inflating scope: when doing less is genuinely best, that option goes first. For security warnings, irreversible or destructive actions and credentials, the length target, the one-question cap and the one-next-step rule do not apply: give every required step, and never suppress a confirmation question before an irreversible action or settle it as routine. A style the user chose may set a safety warning's sentence form, never its length or detail. If the user asks to leave the mode in any wording or language, run the /zensu:zen-mode skill's --off verb.
      <!-- zensu:chain-anchor -->
      ZENSU CHAIN ANCHOR: none
      <!-- /zensu:chain-anchor -->

    This session began when the user asked you to fix the broken password-reset
    link in the emails their web shop sends. In earlier turns you found that the
    link pointed at the staging host, fixed the email template, added a regression
    test and opened pull request #42, whose checks passed. Since the user's last
    message you confirmed that pull request #42 was merged into main, that git
    status in this session's worktree reports a clean tree, that no ignored file
    and no repository nested in the worktree holds anything still needed, that
    nothing is left to push, and that no background task or other session still
    runs for this work. No question to the user is open.

    Now answer the user's message: Is anything left to do here?
assert:
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const first = lines[0] || '';
      const ok = /\b(?:nothing|no|none|done|finished|complete|completed|merged|wrapped up|all set)\b/i.test(first);
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: (ok ? "Opens with the result, that nothing is left: " : "The result-first rule requires the first prose line to give the result, that nothing is left to do; got: ")
          + JSON.stringify(first.slice(0, 120))
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const bullet = (l) => /^(?:[-*•]|\d+[.)])\s+/.test(l);
      const opener = (l) => /^(?:[-*•]|\d+[.)])\s+(?:\*\*)?(?:started\b|(?:session\s+)?(?:goal|purpose|aim|focus)\b|you\s+started\s+(?:this|the)\s+session\b|(?:this|the)\s+session\s+(?:began|started|is\s+for)\b)/i.test(l);
      let end = -1;
      lines.forEach((l, i) => { if (bullet(l)) end = i; });
      let start = end;
      while (start > 0 && bullet(lines[start - 1])) start -= 1;
      const stop = end < 0 ? lines.length - 1 : start;
      let goal = -1;
      lines.forEach((l, i) => { if (i > 0 && (i < stop ? !bullet(l) : (i === start && opener(l))) && /password/i.test(l) && /(?:reset|link|e-?mail)/i.test(l)) goal = i; });
      const ok = goal > 0;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The session block names what the session was started for: " + lines[goal]
          : "The session-block rule still holds when the session is done: a line naming what the user started the session for, the broken password-reset link, must come between the result and the closing step."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map(undecorate).filter(Boolean);
      const last = lines[lines.length - 1] || '';
      const offers = (l) => /\barchiv/i.test(l) || (/\bclos(?:e|ed|ing)\b/i.test(l) && /\bsession\b|\bclose[sd]? it\b/i.test(l));
      const ok = offers(last);
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The closing step says the session can be archived: " + last
          : "Once the work is finished and nothing holds the session open, the one closing step says the session is done and can be archived or closed; got: " + JSON.stringify(last)
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map(undecorate).filter(Boolean);
      const extra = lines.slice(0, -1).filter((l) => /^(?:next(?:\s+step)?|or|alternatively)\b/i.test(l));
      const ok = lines.length > 0 && extra.length === 0;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "Exactly one next step closes the reply."
          : "The one-next-step rule allows a single closing step, and these lines above it add another: " + JSON.stringify(extra)
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const calls = [...raw.matchAll(/^\[tool_use:[^\]]*\][^\n]*/gm)].map((m) => m[0]).filter((l) => /archiv/i.test(l));
      const claim = /\bI(?:\s+have|['’]ve)?\s+(?:just\s+|now\s+|already\s+)?(?:archived|closed)\s+(?:this|the)\s+session\b/i.test(prose);
      const ok = calls.length === 0 && !claim;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The session is left for the user to archive."
          : "The model must never archive or close the session itself; " + (calls.length ? "it called: " + calls.join(' | ') : "its prose says it did.")
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchors = prose.split('\n').map(undecorate).filter((l) => /^(?:Zensu|Run):/.test(l));
      return {
        pass: anchors.length === 0,
        score: anchors.length === 0 ? 1 : 0,
        reason: anchors.length
          ? "The note supplied `none`, so no chain-progress anchor may be rendered; got: " + anchors.join(' | ')
          : "No anchor rendered, as the supplied `none` requires.",
      };
