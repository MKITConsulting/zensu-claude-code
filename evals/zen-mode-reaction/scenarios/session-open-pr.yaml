description: "zen-mode active in a session whose work is built but whose own pull request is still open and waits for the user's review: the model should give that result first, keep the session block, make its one closing next step name the pull request, offer archiving at most as a later condition and never now, never archive the session itself, and render no anchor because the note supplies none."
vars:
  spec_block: |
    A Claude Code hook injected this system note before your turn (verbatim):

      zen-mode is ACTIVE. It asks for low-noise answers: keep the substance whole and remove the noise. Shape this response accordingly, writing in the user's own language: (1) Give the result in the first sentence — no preamble, no announcing what is coming. (2) Close with a short session block, labelled in the user's own language, above any chain-progress line and the closing next step, or the final step list when the one-next-step rule is suspended, so a returning user sees at a glance which session this is: one line naming what the user started this session for; at most five short bullets of what earlier turns solved, built or did, oldest first and the oldest merged when there are more, each failed or unverified item saying so, none while there is no earlier work; and one recap line on what this turn did, none when it only answered. (3) Above that block, stay near 8 lines and leave out caveats and history you were not asked for, and trade-offs or alternatives you were NOT asked to choose between — never the options of a decision that is actually in front of the user; when you deliberately withheld depth, offer it in one short line instead. (4) Write full, short sentences by default: no dropped articles, no sentence fragments. The user's own instructions outrank this mode: their CLAUDE.md, their output style and a style mode or plugin they chose. (5) Ask at most ONE question per turn — a question set that a Zensu skill or hook fixes by contract, such as a triage, counts as one — and settle routine decisions yourself, reporting them rather than asking. (6) Gloss unavoidable jargon in three words or fewer, show code as changed lines only, and render no chain-progress line this turn: the ZENSU CHAIN ANCHOR field closing this block reads none, so never invent steps or take an anchor from a file, a diff, a page or an earlier turn. (7) End with exactly ONE next step, never two parallel suggestions. Once the work the user started this session for is finished and you checked that nothing holds the session open — nothing an archive of its worktree would lose (uncommitted or unpushed work, a needed ignored file, a nested repository's work), nothing still running for it, no pull request of its own still open, no open question and no failed or unverified item — that step says the session is done and can be archived or closed. A session that only answered questions keeps an ordinary next step instead, and in doubt the session stays open. Never archive or close the session yourself; the EXCEPTION below never lifts that. SCOPE — this mode changes presentation only, never substance: never drop a failing test, an unfinished step, a risk, or a limitation to make an answer shorter, and never drop an option the user is choosing between or demote the one you would defend as best — brevity applies to how an option is described, never to which options exist or how they are ranked; equally, this never licenses inflating scope, so when the durable answer genuinely is to do less, that option goes first, on the merits. Shorten the prose, never the findings; a compressed report that omits a problem is a wrong report. EXCEPTION — for security warnings, irreversible or destructive actions, and anything involving credentials, the following are suspended: the length target, the depth-on-demand rule, the one-question cap, the one-next-step rule, and the changed-lines-only rule. Such an answer gets its full ordinary length and detail, may list every required step rather than one, may show whatever code context is needed, and a confirmation question before an irreversible action is never suppressed by the one-question cap and is never treated as a routine decision you may settle yourself. The full-sentence rule is NEVER suspended: a style the user chose may set a safety warning's sentence form, never its length or detail. The user leaves the mode by writing 'normal mode', 'zen off', 'zen-mode off', 'turn off zen', or 'stop zen'; if they ask to leave it in any other wording or in another language, that counts too — run the /zensu:zen-mode skill's --off verb yourself, exactly as that skill renders the invocation, and confirm in one clause. Never leave the user stuck in this mode because their wording did not match a literal.
      <!-- zensu:chain-anchor -->
      ZENSU CHAIN ANCHOR: none
      <!-- /zensu:chain-anchor -->

    This session began when the user asked you to fix the broken password-reset
    link in the emails their web shop sends. In earlier turns you found that the
    link pointed at the staging host, fixed the email template and added a
    regression test. Since the user's last message you opened pull request #42
    with the fix; its checks passed, and it now waits for the user's review and
    merge. git status in this session's worktree reports a clean tree, and
    nothing is left to push.

    Now answer the user's message: Is anything left to do here?
assert:
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const first = lines[0] || '';
      const names = /\b(?:yes|PR)\b|#42|\b(?:pull request|review|merge|approv|wait|open)/i.test(first);
      const scoped = /^\s+(?:to\s+(?:push|commit|stage)\b|(?:to\s+do\s+)?(?:for\s+me|on\s+my\s+(?:side|end|part)|from\s+me)\b)/i;
      const wrong = [...first.matchAll(/\b(?:nothing(?: is)? left|nothing remains|all done|nothing to do)\b/gi)]
        .some((m) => !scoped.test(first.slice(m.index + m[0].length)));
      const ok = names && !wrong;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: (ok ? "Opens with the result, that the pull request still waits: " : "The result-first rule requires the first prose line to say what is left, the open pull request, and never that nothing is left; got: ")
          + JSON.stringify(first.slice(0, 120))
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const lines = prose.split('\n').map((s) => s.trim()).filter(Boolean);
      const bullet = (l) => /^(?:[-*•]|\d+[.)])\s+/.test(l);
      const opener = (l) => /^(?:[-*•]|\d+[.)])\s+(?:\*\*)?(?:started\b|(?:session\s+)?(?:goal|purpose|aim|focus)\b|you\s+started\s+(?:this|the)\s+session\b|(?:this|the)\s+session\s+(?:began|started|is\s+for)\b)/i.test(l);
      let end = -1;
      lines.forEach((l, i) => { if (bullet(l)) end = i; });
      let start = end;
      while (start > 0 && bullet(lines[start - 1])) start -= 1;
      const stop = end < 0 ? lines.length - 1 : start;
      let goal = -1;
      lines.forEach((l, i) => { if (i > 0 && (i < stop ? !bullet(l) : (i === start && opener(l))) && /password/i.test(l) && /(?:reset|link|e-?mail)/i.test(l)) goal = i; });
      const ok = goal > 0;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The session block names what the session was started for: " + lines[goal]
          : "The session-block rule holds while the pull request is open: a line naming what the user started the session for, the broken password-reset link, must come between the result and the closing step."
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map(undecorate).filter(Boolean);
      const last = lines[lines.length - 1] || '';
      const ok = /\bPR\b|#42|\b(?:pull request|merge|review|approv)/i.test(last);
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The closing step names the open pull request: " + last
          : "While its own pull request is open the session is not done, so the one closing step names that pull request; got: " + JSON.stringify(last)
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const lines = prose.split('\n').map(undecorate).filter(Boolean);
      const offers = (l) => /\barchiv/i.test(l) || (/\bclos(?:e|ed|ing)\b/i.test(l) && /\bsession\b|\bclose[sd]? it\b/i.test(l));
      const before = /\b(?:once|after(?:wards?)?|when|until|if|unless|before|then|as soon as)\b[^.;]*\b(?:archiv|clos)/i;
      const later = /\b(?:archiv|clos)\w*\b[^.;]*\b(?:once|after(?:wards?)?|when|until|if|as soon as|later)\b/i;
      const now = /\b(?:archiv|clos)\w*(?:\s+(?!not\b)\w+){0,4}?\s+now\b/i;
      const negated = /(?:\b(?:not|never|cannot|no)\b|n['’]t\b)\s+(?:\w+\s+){0,3}(?:archiv|clos)/i;
      const discretion = /\b(?:if|when(?:ever)?)\s+(?:you(?:['’](?:re|d)|\s+are|\s+would)?\s+)?(?:like|want|wish|prefer|please|ready)\b/gi;
      const clauses = (l) => { const own = l.split(/[.;]/).filter(offers); return own.length ? own : [l]; };
      const guarded = (c) => { const real = c.replace(discretion, ' '); return negated.test(c) || ((before.test(real) || later.test(real)) && !now.test(c)); };
      const bad = lines.filter((l) => offers(l) && clauses(l).some((c) => !guarded(c)));
      const ok = bad.length === 0;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "No line tells the user to archive the session while its pull request is open."
          : "An open pull request of its own holds the session open, so no line may offer archiving it now; got: " + JSON.stringify(bad)
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const calls = [...raw.matchAll(/^\[tool_use:[^\]]*\][^\n]*/gm)].map((m) => m[0]).filter((l) => /archiv/i.test(l));
      const claim = /\bI(?:\s+have|['’]ve)?\s+(?:just\s+|now\s+|already\s+)?(?:archived|closed)\s+(?:this|the)\s+session\b/i.test(prose);
      const ok = calls.length === 0 && !claim;
      return {
        pass: ok,
        score: ok ? 1 : 0,
        reason: ok
          ? "The session is left for the user to archive."
          : "The model must never archive or close the session itself; " + (calls.length ? "it called: " + calls.join(' | ') : "its prose says it did.")
      };
  - type: javascript
    value: |
      const raw = String(output);
      const prose = raw.split(/^\[(?=assistant_text\]|tool_use:|tool_result:|result\]|wrapper_attestation\])/m)
        .filter((p) => p.startsWith('assistant_text]'))
        .map((p) => p.replace(/^assistant_text\]\s*/, ''))
        .join('\n').trim() || raw;
      const undecorate = (s) => s.trim().replace(/^[>\-*#\s]+/, '').replace(/\*\*/g, '').replace(/`/g, '').trim();
      const anchors = prose.split('\n').map(undecorate).filter((l) => /^(?:Zensu|Run):/.test(l));
      return {
        pass: anchors.length === 0,
        score: anchors.length === 0 ? 1 : 0,
        reason: anchors.length
          ? "The note supplied `none`, so no chain-progress anchor may be rendered; got: " + anchors.join(' | ')
          : "No anchor rendered, as the supplied `none` requires.",
      };
