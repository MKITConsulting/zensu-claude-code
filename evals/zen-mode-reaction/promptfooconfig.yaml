description: "zen-mode model-reaction eval (contract compliance, a compression mode the user chose outranking it, the never-compress safety carve-out, the rule-6 chain-progress anchor, that anchor's failed-and-omitted half, the closing session block in a session with earlier work and on a first turn that only answers, and the short body every later prompt of a context generation carries, graded standing alone on contract compliance, the safety carve-out, the anchor and both session blocks). Grades how the model REACTS to the injected zen-mode contract."

providers:
  - id: 'exec: ../../scripts/claude-promptfoo-wrapper.sh'
    config:
      working_dir: ./test-projects/empty-host

prompts:
  - id: zen-mode-reaction
    label: "zen-mode reaction probe (simulated injected contract + task)"
    raw: |
      {{spec_block}}

defaultTest:
  options:
    transform: |
      return typeof output === 'string' ? output : JSON.stringify(output);

tests:
  - file://scenarios/contract-compliance.yaml
  - file://scenarios/precedence-over-compression.yaml
  - file://scenarios/safety-carve-out.yaml
  - file://scenarios/anchor-multi-step.yaml
  - file://scenarios/anchor-failed-step.yaml
  - file://scenarios/short-contract-compliance.yaml
  - file://scenarios/short-safety-carve-out.yaml
  - file://scenarios/short-anchor-multi-step.yaml
  - file://scenarios/session-block.yaml
  - file://scenarios/session-block-first-turn.yaml
  - file://scenarios/short-session-block.yaml
  - file://scenarios/short-session-block-first-turn.yaml

evaluateOptions:
  maxConcurrency: 2
  repeat: 3
