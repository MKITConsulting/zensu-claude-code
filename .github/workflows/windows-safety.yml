name: win32 lock identity probe

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: win32-lock-identity-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: win32 start-time probe (${{ matrix.image }} run ${{ matrix.rep }})
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
        rep: [1, 2]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Shell facts
        continue-on-error: true
        timeout-minutes: 3
        run: bash .github/probe/shell-facts.sh
      - name: Probe helper cost and semantics
        env:
          PROBE_LABEL: ${{ matrix.image }}-${{ matrix.rep }}
        run: node .github/probe/win32-start-time-probe.js "$RUNNER_TEMP/probe"
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win32-probe-${{ matrix.image }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/probe
          retention-days: 14
