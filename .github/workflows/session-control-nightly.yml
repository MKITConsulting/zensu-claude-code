name: Session Control Nightly

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-control-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-validation:
    name: Session Control validation (Claude ${{ matrix.claude_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - claude_version: '2.1.211'
            full_suite: true
          - claude_version: '2.1.217'
            full_suite: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZENSU_E2E_DISPOSABLE_ENVIRONMENT: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          echo "ZENSU_SESSION_CONTROL_EVIDENCE_DIR=$RUNNER_TEMP/session-control-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/session-control-evidence"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare verified Claude Bash sandbox
        run: bash .github/scripts/prepare-claude-sandbox-linux.sh
      - name: Install matrix Claude Code CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@${{ matrix.claude_version }}"
          test "$(claude --version | sed -nE '1s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')" = "${{ matrix.claude_version }}"
      - name: Fail closed when credentials are absent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: test -n "${ANTHROPIC_API_KEY}${CLAUDE_CODE_OAUTH_TOKEN}"
      - name: Session Control self-check and offline contract
        env:
          ZENSU_EXPECTED_PLUGIN_ROOT: ${{ github.workspace }}
          ZENSU_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          npm run session-control:selfcheck
          npm run session-control:contract
      - name: Side-by-side v0.16.1 upgrade validation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZENSU_EXPECTED_CLAUDE_VERSION: ${{ matrix.claude_version }}
          ZENSU_UPGRADE_EXISTING_LOGIN: '0'
          ZENSU_EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
          ZENSU_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: npm run session-control:upgrade
      - name: Live fresh-session validation
        if: matrix.full_suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZENSU_EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
          ZENSU_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: npm run session-control:live
      - name: Four-way session isolation (three repetitions)
        if: matrix.full_suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZENSU_EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
          ZENSU_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: npm run session-control:concurrency
      - name: Reviewer boundary attacks (six categories, five repetitions)
        if: matrix.full_suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZENSU_EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
          ZENSU_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: npm run session-control:adversarial

      - name: Upload sanitized SHA-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-control-nightly-claude-${{ matrix.claude_version }}-${{ github.sha }}
          path: ${{ runner.temp }}/session-control-evidence/
          if-no-files-found: error
          retention-days: 90
