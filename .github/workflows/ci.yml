name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded head keeps burning a full run otherwise: one ubuntu suite plus five
# Windows runners for a commit nobody will merge. Pushing a fixup while CI is in
# flight is the normal case, not the exception. Keyed per ref, so concurrent PRs
# never cancel each other.
#
# main is deliberately NOT cancellable: its runs are the record that a merged
# commit was green, and `github.run_id` gives each one a unique group so none can
# supersede another. Cancelling there would leave a merged commit with no verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'pr' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Deterministic suite (ubuntu-latest ${{ strategy.job-index }})
    runs-on: ubuntu-latest
    # The suite ran sequentially in one job for 72 minutes and was the whole
    # workflow's critical path — more than twice the Windows shards, which have
    # been parallel for far longer. The slice is derived from the ENFORCED suite
    # inventory, so a new suite lands in some shard automatically; the weight
    # table only decides which.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Both halves come from the matrix itself. Writing the total as a literal
      # beside the shard list is the one edit that could silently drop suites:
      # bump the list to six and leave `/5` behind and a sixth of the inventory
      # runs nowhere, with every remaining shard green.
      - run: bash tests/run-all.sh --ci "--shard=$((JOB_INDEX + 1))/$JOB_TOTAL"
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
      - name: Show suite report on failure
        if: failure()
        run: |
          shopt -s nullglob
          reports=(tests/results/run-all-*.txt)
          if ((${#reports[@]})); then
            cat "${reports[@]}"
          else
            echo 'No full-suite report was produced; inspect the failed preflight step above.'
          fi

  windows-shards:
    name: Windows contract shard (${{ matrix.profile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile:
          - windows-reset-session
          - windows-leases-routing
          - windows-native-state
          - windows-installed-core
          - windows-native-branches
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Windows contract profile
        id: profile
        env:
          ZENSU_PROFILE_REPORT_DIR: ${{ runner.temp }}/windows-profile-reports
          ZENSU_PROFILE_SOURCE_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node tests/run-profile.js "${{ matrix.profile }}"
      - name: Record shard outcome
        if: always()
        env:
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
        run: |
          echo "### Windows profile: ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- outcome: $PROFILE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- source: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Windows profile timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-profile-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-profile-reports/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30

  windows-shard-summary:
    name: Deterministic suite (windows-latest)
    if: always()
    needs: [windows-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Download all profile reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-profile-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-shards/profiles
          merge-multiple: true
      - name: Validate blocking shard evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ZENSU_SHARD_JOB_RESULT: ${{ needs.windows-shards.result }}
        run: |
          test "$ZENSU_SHARD_JOB_RESULT" = success
          node tests/summarize-windows-observation.js summarize-shards \
            "$RUNNER_TEMP/windows-shards/profiles" \
            "$RUNNER_TEMP/windows-shards/windows-shard-summary.json"
      - name: Upload aggregate shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-shards-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-shards/windows-shard-summary.json
          if-no-files-found: error
          retention-days: 30

  session-control-sandbox:
    name: Session Control sandbox prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Prepare verified Claude Bash sandbox
        run: bash .github/scripts/prepare-claude-sandbox-linux.sh
      - name: Contained Session Control hook integration
        run: bash tests/structure/test-session-control-sandbox-hook-integration.sh
        env:
          ZENSU_RUN_LINUX_SANDBOX_HOOK_INTEGRATION: '1'
