name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Deterministic suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Windows path and Core lease canary
        if: runner.os == 'Windows'
        run: |
          bash tests/structure/test-msys-runtime-boundaries.sh
          bash evals/session-control/tests/marketplace-fixture-selftest.sh
          bash evals/session-control/tests/installed-plugin-provisioner-selftest.sh
          bash evals/session-control/tests/wrapper-selftest.sh
          bash tests/structure/test-pre-edit-hook-mirror.sh
          bash tests/structure/test-session-control-claude.sh
          bash tests/structure/test-session-start-banner.sh
          bash tests/structure/test-session-id-v1.sh
          bash tests/structure/test-deferred-review-claim.sh
          bash tests/structure/test-deferred-review-fallback.sh
          bash tests/structure/test-review-worker-evidence-lease.sh
          bash tests/structure/test-reviewer-capability-gate.sh
          bash tests/structure/test-autopilot-plan-delegate.sh
          bash tests/structure/test-post-review-self-review-handoff.sh
          bash tests/structure/test-stop-enforcer-self-review-routing.sh
          bash tests/structure/test-bash-source-write-gate.sh
          bash tests/structure/test-tdd-no-flock-external-lease.sh
          bash tests/session-control/run.sh
      - run: bash tests/run-all.sh
      - name: Show suite report on failure
        if: failure()
        run: |
          shopt -s nullglob
          reports=(tests/results/run-all-*.txt)
          if ((${#reports[@]})); then
            cat "${reports[@]}"
          else
            echo 'No full-suite report was produced; inspect the failed preflight step above.'
          fi

  session-control-contract:
    name: Session Control contract (Promptfoo 0.121.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate every Session Control Promptfoo config
        run: |
          set -euo pipefail
          export PROMPTFOO_CONFIG_DIR="$RUNNER_TEMP/promptfoo-config"
          mkdir -p "$PROMPTFOO_CONFIG_DIR"
          npx --no-install promptfoo validate config -c \
            evals/session-control/promptfooconfig-contract.yaml \
            evals/session-control/promptfooconfig-live.yaml \
            evals/session-control/promptfooconfig-concurrency.yaml \
            evals/session-control/promptfooconfig-adversarial.yaml \
            evals/reset-review-limit/promptfooconfig.yaml
      - name: Wrapper and configuration self-checks
        run: npm run session-control:selfcheck
      - name: Offline attestation contract
        env:
          ZENSU_EXPECTED_PLUGIN_ROOT: ${{ github.workspace }}
          ZENSU_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: npm run session-control:contract
