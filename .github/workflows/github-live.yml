name: GitHub live

on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      gh:
        description: 'pinned, or a comma-separated list of pinned gh versions'
        required: false
        default: pinned

permissions:
  contents: read

concurrency:
  group: github-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: GitHub live scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.decide.outputs.lanes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which lanes run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule) lanes='["pinned"]' ;;
            workflow_dispatch) lanes='["dispatch"]' ;;
            pull_request)
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid base SHA '$BASE_SHA'" >&2; exit 1; }
              changed="$(git diff --name-only "$BASE_SHA" HEAD -- hooks/lib/zensu-vcs.sh tests/integration/github .github/workflows/github-live.yml)"
              if [ -z "$changed" ]; then
                lanes='[]'
              elif [ "$HEAD_REPO" != "$REPO" ] || [ "$ACTOR" = 'dependabot[bot]' ]; then
                echo "::notice::This pull request changes the GitHub driver path, but a run from $HEAD_REPO by $ACTOR gets no sandbox credential; the nightly run and the release gate cover it."
                lanes='[]'
              else
                lanes='["pinned"]'
              fi
              ;;
            *) echo "unexpected event $EVENT" >&2; exit 1 ;;
          esac
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "GitHub live lanes: $lanes"

  live:
    name: GitHub live (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.lanes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.scope.outputs.lanes) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Run the live GitHub suite
        env:
          LANE: ${{ matrix.lane }}
          DISPATCH_GH: ${{ inputs.gh }}
          ZENSU_GITHUB_IT_CACHE: ${{ runner.temp }}/github-it
          ZENSU_GITHUB_IT_APP_ID: ${{ vars.ZENSU_GITHUB_IT_APP_ID }}
          ZENSU_GITHUB_IT_REPO: ${{ vars.ZENSU_GITHUB_IT_REPO }}
          ZENSU_GITHUB_IT_APP_KEY: ${{ secrets.ZENSU_GITHUB_IT_APP_KEY }}
        run: |
          set -euo pipefail
          case "$LANE" in
            pinned) selection=pinned ;;
            dispatch) selection="${DISPATCH_GH:-pinned}" ;;
            *) echo "unknown lane $LANE" >&2; exit 2 ;;
          esac
          bash tests/integration/github/run.sh --gh "$selection"

  result:
    name: GitHub live result
    needs: [scope, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the GitHub live verdict
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          LANES: ${{ needs.scope.outputs.lanes }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE_RESULT lanes=${LANES:-<none>} live=$LIVE_RESULT"
          [ "$SCOPE_RESULT" = success ] || { echo 'the scope job did not succeed' >&2; exit 1; }
          if [ "$LANES" = '[]' ]; then
            [ "$LIVE_RESULT" = skipped ] || { echo 'the live job ran although no lane was selected' >&2; exit 1; }
          else
            [ "$LIVE_RESULT" = success ] || { echo 'the live job did not succeed' >&2; exit 1; }
          fi

  drift:
    name: GitHub pin drift
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.compare.outputs.report }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Compare the pins with the newest gh release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tests/integration/github/drift.sh > "$RUNNER_TEMP/drift.md"
          node -e 'process.stdout.write(`report=${JSON.stringify(require("fs").readFileSync(process.argv[1], "utf8"))}\n`)' "$RUNNER_TEMP/drift.md" >> "$GITHUB_OUTPUT"

  drift-issue:
    name: Track the pin drift
    needs: [drift]
    if: needs.drift.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPORT: ${{ fromJSON(needs.drift.outputs.report) }}
        run: |
          set -euo pipefail
          label='github-live-drift'
          gh label create "$label" --repo "$REPO" --color FBCA04 --description 'gh released past the live-check pins' --force
          number="$(gh issue list --repo "$REPO" --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$REPORT" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$REPO" --comment 'The pins cover the newest gh release again.'
            fi
            exit 0
          fi
          IFS= read -r marker <<< "$REPORT"
          case "$marker" in
            '<!-- zensu-github-drift '*' -->') ;;
            *) echo 'the drift report does not start with its marker line' >&2; exit 1 ;;
          esac
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title 'GitHub live pins are behind upstream' --label "$label" --body "$REPORT"
            exit 0
          fi
          current="$(gh issue view "$number" --repo "$REPO" --json body --jq .body)"
          case "$current" in
            *"$marker"*) echo "issue $number already lists this release" ;;
            *)
              gh issue edit "$number" --repo "$REPO" --body "$REPORT"
              gh issue comment "$number" --repo "$REPO" --body 'Upstream moved on; the description lists the newest release now.'
              ;;
          esac

  notify:
    name: Report a red scheduled run
    needs: [result, drift, drift-issue]
    if: always() && github.event_name == 'schedule' && (needs.result.result != 'success' || needs.drift.result != 'success' || needs.drift-issue.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label='github-live'
          title='GitHub live check is red'
          body="The scheduled GitHub live run failed: $RUN_URL"
          gh label create "$label" --repo "$REPO" --color B60205 --description 'A scheduled GitHub live run is red' --force
          number="$(gh issue list --repo "$REPO" --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --label "$label" --body "$body"
          fi
